<body>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a wooden game table. One phone-sized column: home, setup, board with dice, settings, profile.
   Classic board-game look: walnut table, cream cards, bevelled buttons, ivory dice. */
:root{
  --bg:#d6bb8c; --table:#c9a574; --surface:#fff4dc; --surface2:#f1dcae; --fg:#2b1b0d; --muted:#6a5236; --edge:#7a4e24;
  --green:#1e9e4a; --yellow:#f4c20d; --red:#d93025; --blue:#1a6fd4; --on-color:#ffffff;
  --display:"Cinzel","Cairo",Georgia,serif; --body:"Inter","Cairo","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2a1c10;--table:#3a2918;--surface:#4a3420;--surface2:#5d4228;--fg:#fbeed4;--muted:#cdb58f;--edge:#1a0f06;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1c10;--table:#3a2918;--surface:#4a3420;--surface2:#5d4228;--fg:#fbeed4;--muted:#cdb58f;--edge:#1a0f06;color-scheme:dark}
body[data-pref="dark"]{--bg:#2a1c10;--table:#3a2918;--surface:#4a3420;--surface2:#5d4228;--fg:#fbeed4;--muted:#cdb58f;--edge:#1a0f06;color-scheme:dark}
body[data-pref="light"]{--bg:#d6bb8c;--table:#c9a574;--surface:#fff4dc;--surface2:#f1dcae;--fg:#2b1b0d;--muted:#6a5236;--edge:#7a4e24;color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 2px,transparent 2px 9px);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-block:12px}
.screen{display:none;flex:1;min-height:0;flex-direction:column;gap:12px}
.screen.on{display:flex}
h1,h2{font-family:var(--display);margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Home */
.home{align-items:center;gap:14px;overflow:auto}
.logo{width:104px;height:104px;margin-top:14px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
.brand{font-weight:900;font-size:46px;letter-spacing:.3em;padding-inline-start:.3em;margin:0 0 8px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.menu{display:flex;flex-direction:column;gap:14px;width:100%}
.big{display:flex;align-items:center;gap:14px;width:100%;padding:17px 20px;border-radius:14px;color:var(--on-color);
  font-weight:700;font-size:17px;text-align:start;border:2px solid rgba(0,0,0,.4);
  box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .1s,box-shadow .1s;animation:rise .5s both}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35)}
.big svg{flex:none;width:28px;height:28px}
.menu .big:nth-child(2){animation-delay:.08s}.menu .big:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.dock{margin-top:auto;display:flex;justify-content:center;gap:26px;padding-top:10px}
.dock button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);padding:8px 16px;border-radius:12px}
.dock svg{width:26px;height:26px;color:var(--edge)}

.bar{display:flex;align-items:center;gap:8px}
.bar h2{font-size:21px;flex:1}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--edge);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.icon svg{width:22px;height:22px}
[dir="rtl"] .flip{transform:scaleX(-1)}

.label{font-weight:700;margin:10px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;background:var(--surface);border:2px solid var(--edge);font-weight:600}
.chip[aria-pressed="true"]{background:var(--yellow);color:#2b1b0d}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:14px;padding:16px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.note{color:var(--muted);line-height:1.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:56px;height:32px;border-radius:999px;background:#9b8b78;position:relative;transition:background .2s;border:2px solid var(--edge)}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.switch[aria-pressed="true"]{background:var(--green)}
.switch[aria-pressed="true"]::after{inset-inline-start:26px}

/* Game */
.players{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:6px}
.pl{display:flex;flex-direction:column;gap:2px;padding:6px 7px;border-radius:12px;background:var(--surface);border:2px solid var(--edge);min-width:0;transition:transform .2s,box-shadow .2s}
.pl.act{border-color:var(--c);box-shadow:0 0 0 3px var(--c);transform:translateY(-2px)}
.pl i{width:13px;height:13px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.45);flex:none}
.pl b{display:flex;align-items:center;gap:4px;font-size:11.5px;min-width:0}
.pl b em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-inline-start:17px}
.boardwrap{width:calc(100% + 32px);max-width:calc(100vh - 150px);aspect-ratio:1;margin-inline:-16px;align-self:center;flex:none}
canvas{width:100%;height:100%;display:block;touch-action:manipulation}
.hud{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:auto;padding-bottom:6px}
.turn{font-family:var(--display);font-weight:900;font-size:17px}
.hint{font-size:13px;color:var(--muted);min-height:18px;font-weight:600}
.die{width:72px;height:72px;border-radius:18px;background:linear-gradient(145deg,#fffef8,#efe6cf);border:2px solid #2b1b0d;padding:11px;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);box-shadow:0 0 0 4px var(--c,var(--blue)),0 9px 0 rgba(0,0,0,.3);transition:transform .1s,opacity .2s,box-shadow .1s;margin-bottom:6px}
.die:disabled{opacity:.55}
.die:not(:disabled):active{transform:translateY(5px);box-shadow:0 0 0 4px var(--c,var(--blue)),0 4px 0 rgba(0,0,0,.3)}
.die.roll{animation:tumble .5s linear}
@keyframes tumble{25%{transform:rotate(90deg) translateY(-14px)}50%{transform:rotate(200deg) translateY(0)}75%{transform:rotate(300deg) translateY(-8px)}to{transform:rotate(360deg)}}
.die span{width:78%;height:78%;margin:auto;border-radius:50%;background:#1b1209;opacity:0}
.die span.d{opacity:1}

.veil{position:fixed;inset:0;background:rgba(15,8,2,.65);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.veil.on{display:flex}
.sheet{background:var(--surface);border:3px solid var(--edge);border-radius:18px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 rgba(0,0,0,.35);animation:rise .35s both}
.rank{display:flex;align-items:center;gap:10px;font-weight:600}
.rank i{width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.45)}
.rank:first-of-type{font-size:19px;font-weight:700}
.btn{padding:14px 18px;border-radius:12px;font-weight:700;text-align:center;background:var(--blue);color:#fff;border:2px solid rgba(0,0,0,.4);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.alt{background:var(--surface2);color:var(--fg)}
.xpbar{height:12px;border-radius:99px;background:var(--surface2);border:2px solid var(--edge);overflow:hidden}
.xpbar div{height:100%;background:var(--yellow);transition:width .5s}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:34px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.players{flex:1;gap:4px}
.pl{flex-direction:row;align-items:center;gap:5px;padding:4px 7px;border-radius:10px}
.pl em{font-style:normal;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pl i{width:11px;height:11px}
.pl.act{box-shadow:0 0 0 2px var(--c);transform:none}
.icon.sm{width:36px;height:36px;border-radius:10px;flex:none}
.bar.top{gap:6px}
.stage{margin-block:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
#die{display:none}
canvas{touch-action:none}
.hud{margin-top:0;padding-bottom:0}
.hint{font-size:14px;text-align:center}
body:has(#s-game.on){padding-left:3px;padding-right:3px}
#app:has(#s-game.on){max-width:none;padding-block:6px}
#s-game.on{gap:4px}
#s-game .stage{position:relative;margin-block:0;align-items:center}
#s-game .boardwrap{width:min(100vw - 6px,100vh - 62px,100dvh - 62px);max-width:none;margin-inline:0}
#s-game .hud{position:absolute;left:0;right:0;bottom:2px;pointer-events:none}
#s-game .hint{font-size:13px;padding:2px 10px;border-radius:10px;background:rgba(0,0,0,.45);color:#fff}
#s-game .hint:empty{display:none}
#s-game .bar.top{max-width:min(100vw - 6px,100vh - 62px,100dvh - 62px);width:100%;align-self:center}
</style>

<div id="app">

  <section class="screen home on" id="s-home">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <rect x="3" y="3" width="45" height="45" rx="10" fill="#1e9e4a" stroke="#2b1b0d" stroke-width="3"/><rect x="52" y="3" width="45" height="45" rx="10" fill="#f4c20d" stroke="#2b1b0d" stroke-width="3"/>
      <rect x="52" y="52" width="45" height="45" rx="10" fill="#d93025" stroke="#2b1b0d" stroke-width="3"/><rect x="3" y="52" width="45" height="45" rx="10" fill="#1a6fd4" stroke="#2b1b0d" stroke-width="3"/>
      <circle cx="50" cy="50" r="16" fill="#fff4dc" stroke="#2b1b0d" stroke-width="3"/>
    </svg>
    <h1 class="brand">SISKA</h1>
    <div class="menu">
      <button class="big" style="background:var(--green)" data-go="setup:solo">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a2 2 0 0 1 1 3.700V7h4a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3h4V5.700A2 2 0 0 1 12 2zM8.500 12a1.500 1.500 0 1 0 0 3 1.500 1.500 0 0 0 0-3zm7 0a1.500 1.500 0 1 0 0 3 1.500 1.500 0 0 0 0-3z"/></svg>
        <span data-t="play_solo"></span></button>
      <button class="big" style="background:var(--blue)" data-go="setup:group">

        <span data-t="play_friends"></span></button>
    </div>
    <div class="dock">
      <button data-go="profile"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg><span data-t="profile"></span></button>
      <button data-go="settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.400 13a7.500 7.500 0 0 0 0-2l2.100-1.600-2-3.500-2.500 1a7.700 7.700 0 0 0-1.700-1L15 3h-4l-.4 2.900c-.6.200-1.200.6-1.700 1l-2.500-1-2 3.500L6.600 11a7.500 7.500 0 0 0 0 2l-2.100 1.600 2 3.500 2.500-1c.5.400 1.100.8 1.700 1L11 21h4l.4-2.900c.6-.2 1.200-.6 1.700-1l2.500 1 2-3.500L19.400 13zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/></svg><span data-t="settings"></span></button>
    </div>
  </section>

  <section class="screen" id="s-setup">
    <div class="bar"><button class="icon" data-go="home" aria-label="Back"><svg class="flip" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.800l5.600-5.600L12 4l-8 8 8 8 1.400-1.400L7.800 13H20z"/></svg></button><h2 id="setup-title"></h2></div>
    <div class="label" data-t="players_count"></div>
    <div class="chips" id="count-chips"></div>

  </section>

  <section class="screen" id="s-game">
    <div class="bar top"><button class="icon sm" id="quit" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg></button><div class="players" id="players"></div></div>
    <div class="turn" id="turn" hidden></div>
    <div class="stage">
      <div class="boardwrap" id="bw"><canvas id="cv"></canvas></div>
      <div class="hud"><div class="hint" id="hint"></div><button class="die" id="die" aria-label="Roll"></button></div>
    </div>
  </section>

  <section class="screen" id="s-online">
    <div class="bar"><button class="icon" data-go="home" aria-label="Back"><svg class="flip" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.800l5.600-5.600L12 4l-8 8 8 8 1.400-1.400L7.800 13H20z"/></svg></button><h2 data-t="play_friends"></h2></div>
    <div class="card note" data-t="online_note"></div>
  </section>

  <section class="screen" id="s-settings">
    <div class="bar"><button class="icon" data-go="home" aria-label="Back"><svg class="flip" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.800l5.600-5.600L12 4l-8 8 8 8 1.400-1.400L7.800 13H20z"/></svg></button><h2 data-t="settings"></h2></div>
    <div class="label" data-t="language"></div><div class="chips" id="lang-chips"></div>

  <section class="screen" id="s-profile">

    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <div class="row"><h2 id="lvl"></h2><span id="pts" class="note"></span></div>
      <div class="xpbar"><div id="xpfill"></div></div>
      <div class="stats" style="margin-top:8px">
        <div><b id="w" style="color:var(--green)"></b><span class="note" data-t="wins"></span></div>
        <div><b id="l" style="color:var(--red)"></b><span class="note" data-t="losses"></span></div>
      </div>
    </div>
    <div class="note" data-t="saved_note"></div>
  </section>
</div>

</div></div>

var FINISH=56,LAST=50,SAFE=[0,13,26,39];
function newGame(n){var seats=n==2?[0,2]:n==3?[0,1,2]:[0,1,2,3];return{seats:seats,pieces:seats.map(function(){return[-1,-1,-1,-1]}),turn:0,dice:0,shown:0,winners:[]}}
function absOf(g,p,pr){return(g.seats[p]*13+pr)%52}
function canMove(pr,d){return pr==-1?d==6:pr+d<=FINISH}
function movable(g){if(!g.dice||g.winners.length>=g.seats.length)return[];var r=[];for(var i=0;i<4;i++)if(canMove(g.pieces[g.turn][i],g.dice))r.push(i);return r}
function nextTurn(g,from){var t0=from;for(var k=0;k<g.seats.length;k++){t0=(t0+1)%g.seats.length;if(g.winners.indexOf(t0)<0)return t0}return from}
function clone(g){return{seats:g.seats,pieces:g.pieces.map(function(a){return a.slice()}),turn:g.turn,dice:g.dice,shown:g.shown,winners:g.winners.slice()}}
function rolled(g,v){var s=clone(g);s.dice=v;s.shown=v;if(!movable(s).length){s.dice=0;s.turn=nextTurn(s,s.turn)}return s}
function move(g,idx,spare){
  if(movable(g).indexOf(idx)<0)return g;
  var s=clone(g),me=s.turn,d=s.dice,old=s.pieces[me][idx],nw=old==-1?0:old+d,cap=false;
  s.pieces[me][idx]=nw;
  if(!spare&&nw>=0&&nw<=LAST&&SAFE.indexOf(absOf(s,me,nw))<0){
    var a=absOf(s,me,nw);
    for(var q=0;q<s.seats.length;q++){if(q==me)continue;
      for(var j=0;j<4;j++){var pq=s.pieces[q][j];if(pq>=0&&pq<=LAST&&absOf(s,q,pq)==a){s.pieces[q][j]=-1;cap=true}}}
  }
  if(s.pieces[me].every(function(x){return x==FINISH})&&s.winners.indexOf(me)<0)s.winners.push(me);
  if(s.winners.length==s.seats.length-1){for(var p=0;p<s.seats.length;p++)if(s.winners.indexOf(p)<0){s.winners.push(p);break}}
  s.dice=0;
  if(s.winners.length>=s.seats.length)return s;

function baseCount(g,except){var c=0;g.pieces.forEach(function(a,p){if(p!=except)a.forEach(function(x){if(x==-1)c++})});return c}
/* players whose pawns this move would capture (empty when none, or on a safe square) */
function victims(g,idx){
  var me=g.turn,old=g.pieces[me][idx],nw=old==-1?0:old+g.dice,out=[];
  if(nw<0||nw>LAST||SAFE.indexOf(absOf(g,me,nw))>=0)return out;
  var a=absOf(g,me,nw);
  for(var q=0;q<g.seats.length;q++){if(q==me)continue;
    for(var j=0;j<4;j++){var pq=g.pieces[q][j];if(pq>=0&&pq<=LAST&&absOf(g,q,pq)==a&&out.indexOf(q)<0)out.push(q)}}
  return out;
}
function aiChoose(g){
  var opts=movable(g),best=opts[0],bs=-1e9;
  opts.forEach(function(i){
    var me=g.turn,old=g.pieces[me][i],nw=old==-1?0:old+g.dice,sc=nw;
    if(nw==FINISH)sc+=200;if(old==-1)sc+=60;if(nw>LAST&&nw<FINISH)sc+=40;
    if(nw>=0&&nw<=LAST&&SAFE.indexOf(absOf(g,me,nw))>=0)sc+=25;
    if(baseCount(move(g,i),me)>baseCount(g,me))sc+=120;
    if(old>=0&&old<=LAST&&SAFE.indexOf(absOf(g,me,old))>=0)sc-=10;
    if(sc>bs){bs=sc;best=i}
  });return best;
}

function posOf(seat,pr,i){
  if(pr==-1)return[BASES[seat][0]+(i%2?4:2),BASES[seat][1]+(i<2?2:4)];
  if(pr<=LAST){var c=TRACK[(seat*13+pr)%52];return[c[1]+.5,c[0]+.5]}

}

var AC=null,NB=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();return AC}catch(e){return null}}
function noise(){var c=ac();if(!c)return null;if(!NB){NB=c.createBuffer(1,c.sampleRate*.3,c.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NB}
function osc(type,f0,f1,dur,vol,when){
  if(!store.sound)return;var c=ac();if(!c)return;var t0=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+.02);
}
function click(freq,vol,when,dur){ /* short filtered noise = wooden tap */
  if(!store.sound)return;var c=ac(),b=noise();if(!c||!b)return;var t0=c.currentTime+(when||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=b;f.type="bandpass";f.frequency.value=freq;f.Q.value=3;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+(dur||.07));
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(t0,Math.random()*.1);s.stop(t0+(dur||.07)+.02);
}

/* move a pawn one square at a time */

  hideDie();
  busy=true;var my=session,me=G.turn,old=G.pieces[me][idx],ng=move(G,idx,spare),nw=ng.pieces[me][idx],steps=[];
  if(old==-1)steps=[0];else for(var p=old+1;p<=nw;p++)steps.push(p);
  var i=0;renderHud();
  (function stepFn(){
    if(my!==session)return;
    var pr=steps[i];D[me][idx]=pr;hopAt[me*4+idx]=performance.now();
    if(old==-1)sfx.pop();else if(pr==51)sfx.home();else sfx.step(i);
    buzz(8);i++;
    if(i<steps.length)setTimeout(stepFn,STEP);else setTimeout(land,STEP+30);
  })();

    if(my!==session)return;

  if(!G)return;
